name: homology-dp-profile
on:
  push:
    branches:
      - feature/homology-dp-profile-20261014
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - run: gradle :wgl-core:test --tests '*HomologyDpDensityProbeTest' --info --no-daemon
